# THE JOINT Studio: LibreChat configuration
# Notion uses its official hosted MCP endpoint and interactive OAuth.
# No Notion token is stored in Git or launched as an unverified npm subprocess.
# After deployment, connect Notion once from LibreChat's MCP tool settings.
version: 1.3.18
cache: true

mcpServers:
  notion:
    type: streamable-http
    url: https://mcp.notion.com/mcp
    requiresOAuth: true
    timeout: 60000
